<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAUF BAHERUNI Screenshot Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b>RAUF BAHERUNI</b><label class="open">📷 Screenshot खोलें<input id="file" type="file" accept="image/*"></label></header>

<main>
<div class="preview"><canvas id="canvas"></canvas></div>

<div class="buttons">
<button onclick="rotate(-90)">↶ Rotate</button>
<button onclick="rotate(90)">↷ Rotate</button>
<button onclick="flip()">↔ Flip</button>
<button onclick="resetAll()">Reset</button>
<button onclick="download()">⬇️ Save</button>
</div>

<section>
<h3>Screenshot Edit</h3>
<label>Brightness <input id="brightness" type="range" min="50" max="150" value="100"></label>
<label>Contrast <input id="contrast" type="range" min="50" max="150" value="100"></label>
<label>Saturation <input id="saturation" type="range" min="0" max="200" value="100"></label>
<label>Blur <input id="blur" type="range" min="0" max="8" value="0" step=".1"></label>

<div class="filters">
<button onclick="filter('none')">Original</button>
<button onclick="filter('grayscale(1)')">B&W</button>
<button onclick="filter('sepia(.5)')">Warm</button>
<button onclick="filter('saturate(1.5) contrast(1.1)')">Vivid</button>
</div>

<label>Text जोड़ें <input id="text" type="text" placeholder="अपना टेक्स्ट लिखें"></label>
<button class="apply" onclick="render()">Text Apply</button>
</section>
<p class="note">यह editor JPG, PNG और फोन के screenshots को सीधे browser में edit करता है। कोई upload server नहीं है।</p>
</main>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let img=new Image(), angle=0, flipX=1, filterValue='none', textValue='';
let bright=100, contrast=100, saturation=100, blur=0;

img.onload=()=>{fitCanvas();render()};
function fitCanvas(){
 const max=1000, scale=Math.min(1,max/img.naturalWidth);
 canvas.width=Math.round(img.naturalWidth*scale);
 canvas.height=Math.round(img.naturalHeight*scale);
}
function render(){
 ctx.save();
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const rad=angle*Math.PI/180;
 const sideways=Math.abs(angle%180)===90;
 ctx.translate(canvas.width/2,canvas.height/2);
 ctx.rotate(rad);
 ctx.scale(flipX,1);
 ctx.filter=`brightness(${bright}%) contrast(${contrast}%) saturate(${saturation}%) blur(${blur}px) ${filterValue}`;
 let w=sideways?canvas.height:canvas.width, h=sideways?canvas.width:canvas.height;
 ctx.drawImage(img,-w/2,-h/2,w,h);
 ctx.restore();

 if(textValue){
   ctx.save();
   ctx.font=`bold ${Math.max(20,canvas.width/25)}px Arial`;
   ctx.textAlign='center';
   ctx.fillStyle='white';
   ctx.strokeStyle='black';
   ctx.lineWidth=5;
   ctx.strokeText(textValue,canvas.width/2,canvas.height-30);
   ctx.fillText(textValue,canvas.width/2,canvas.height-30);
   ctx.restore();
 }
}
function rotate(n){angle=(angle+n)%360;render()}
function flip(){flipX*=-1;render()}
function filter(v){filterValue=v;render()}
function resetAll(){
 angle=0;flipX=1;filterValue='none';textValue='';
 bright=100;contrast=100;saturation=100;blur=0;
 brightness.value=100;contrastEl.value=100;saturationEl.value=100;blurEl.value=0;text.value='';
 render();
}
function download(){
 render();
 const a=document.createElement('a');
 a.download='RAUF-BAHERUNI-edited-screenshot.png';
 a.href=canvas.toDataURL('image/png');
 a.click();
}
file.onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const reader=new FileReader();
 reader.onload=ev=>{img=new Image();img.onload=()=>{fitCanvas();render()};img.src=ev.target.result};
 reader.readAsDataURL(f);
};

const brightness=document.getElementById('brightness');
const contrastEl=document.getElementById('contrast');
const saturationEl=document.getElementById('saturation');
const blurEl=document.getElementById('blur');
const text=document.getElementById('text');

brightness.oninput=()=>{bright=+brightness.value;render()};
contrastEl.oninput=()=>{contrast=+contrastEl.value;render()};
saturationEl.oninput=()=>{saturation=+saturationEl.value;render()};
blurEl.oninput=()=>{blur=+blurEl.value;render()};
text.oninput=()=>{textValue=text.value;render()};
</script>
</body>
</html>
